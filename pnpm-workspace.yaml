# pnpm 11 起，包管理与安全设置放在这里（不再读 package.json 的 pnpm 字段）。
# packages 留空：不把以 submodule 引入的第三方目录当成工作区包。

# 依赖安装脚本默认全部禁止，需要放行的在这里逐条列举。
# esbuild 的 postinstall 只是校验二进制；真正的 esbuild.exe 来自它的平台可选依赖
# (@esbuild/win32-x64)，因此禁用该脚本不影响构建。
allowBuilds:
  esbuild: false

# 供应链保护：拒绝安装「刚发布不久」的版本，防止上游刚被投毒就被拉进来。
# pnpm 默认是 1440 分钟（24 小时），实测会频繁挡住正常的补丁版本——
# 例如 rollup 4.63.4 发布 19 小时后仍被拒，导致完全无法构建。
# 这里收紧到 180 分钟：仍能挡住最常见的攻击形态（恶意版本发布后数分钟到数小时内被撤下），
# 又不至于挡不住日常开发。
# 主防线其实是上面的 allowBuilds：安装脚本全禁，恶意包即便被拉进来也无法执行。
minimumReleaseAge: 180
