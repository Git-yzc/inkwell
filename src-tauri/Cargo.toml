[package]
name = "inkwell"
version = "0.1.1"
description = "砚池 (Inkwell) —— 个人自用的跨平台电子书阅读器"
authors = ["Git-yzc"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2 的标准布局：逻辑放 lib，main.rs 只是入口，方便将来写集成测试。
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
sha2 = "0.10.9"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
thiserror = "2.0.20"
base64 = "0.23.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }

[features]
# 生产构建必须开启。不开的话 tauri 的 build.rs 会把 dev 置为 true
# （tauri-2.x/build.rs: dev = !custom_protocol），产物就会去连 devUrl
# 而不是内嵌前端资源 —— Android 上表现为启动即报
# "Failed to request http://localhost:1420/"。
# 官方 CLI 在 release 时会自动加这个特性；我们的 Android shim 绕过了 CLI，
# 所以由 src-tauri/tauri.js 显式传入。
custom-protocol = ["tauri/custom-protocol"]

# 发布版：体积优先。桌面端不需要极致的运行速度。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
